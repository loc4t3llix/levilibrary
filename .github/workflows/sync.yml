name: Sync with upstream

on:
  schedule:
    - cron: "*/30 * * * *"   # ogni 30 minuti
  workflow_dispatch:

jobs:
  sync:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Add upstream
        run: |
          git remote add upstream https://github.com/StraReal/levilibrary.git || true
          git remote set-url upstream https://github.com/StraReal/levilibrary.git

      - name: Configure git user
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      - name: Fetch upstream
        run: git fetch upstream

      - name: Merge upstream
        run: git merge upstream/main --no-edit

      - name: Push changes
        run: git push origin main
