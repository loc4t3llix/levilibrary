name: Sync with upstream

on:
  schedule:
    - cron: "*/30 * * * *"   # ogni 30 minuti
  workflow_dispatch:

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3

      - name: Add upstream
        run: git remote add upstream https://github.com/StraReal/levilibrary.git

      - name: Fetch upstream
        run: git fetch upstream

      - name: Merge upstream
        run: git merge upstream/main

      - name: Push changes
        run: git push origin main
